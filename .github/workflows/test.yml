name: test

on:
  # Every push to the two working branches, so a commit that breaks the gate is
  # caught when it lands rather than on the next daily run. The operator also
  # commits outside an agent's local gate, and public repositories run CI free.
  push:
    branches: [main, development]
  workflow_dispatch:
  # Daily as well, at 10:00 Asia/Colombo (04:30 UTC, which is what cron takes),
  # for what breaks this suite without a commit: the runner image, apt and tool
  # versions drift underneath it, and GitHub's own MCP tool descriptors -- which
  # the contract pins by fingerprint -- have already changed all eighteen at
  # once. The daily run also adds Python 3.12 and the slow tests.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 3.10 on every run: it is the floor this project supports, the version
      # no developer machine here runs, and the one that caught a timeout bug
      # that 3.12 could not see. 3.12 is covered locally on every gate run, so
      # it joins only on the daily schedule, not on a manual dispatch.
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'schedule' && '["3.10", "3.12"]' || '["3.10"]') }}

    steps:
      # Both products resolve shared code from a dotfiles-shared checkout beside
      # their own, so CI lays the workspace out the way a real machine does
      # rather than special-casing the path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: agentbot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PamuduW/dotfiles-shared
          path: dotfiles-shared
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        working-directory: agentbot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install 'zizmor==1.30.1'
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt ripgrep
      - name: Run the full gate
        working-directory: agentbot
        env:
          # The slow lane (the seeded memory stress test) runs on the daily and
          # dispatched runs, not on every push.
          AGENTBOT_SLOW_TESTS: ${{ github.event_name == 'push' && '0' || '1' }}
        run: bash tests/run.sh

  descriptors:
    name: GitHub MCP descriptor drift
    # Weekly only, and only when the token exists. The contract pins eighteen
    # tool descriptors by fingerprint; GitHub added an `icons` field once and
    # changed every one of them at the same time. Catching that on a Monday is
    # the difference between a known upstream change and a mid-task mystery.
    #
    # Add MCP_GITHUB_TOKEN as a repository secret to turn this on. Without it
    # the job reports that and exits clean rather than failing.
    #
    # The secret cannot be called GITHUB_MCP_TOKEN: GitHub reserves the GITHUB_
    # prefix for secret names and refuses to create one. The test reads that
    # name from the environment, which is unrestricted, so the secret is mapped
    # onto it below.
    # Dispatch as well as schedule: a gate you cannot run on demand is a gate
    # you cannot verify, and this one was unverifiable until its secret existed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: agentbot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PamuduW/dotfiles-shared
          path: dotfiles-shared
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Hash-pinned, because the next step holds a GitHub token and anything
      # installed here runs inside it. Regenerate requirements-ci.lock with
      # the command at its top when requirements*.txt change.
      - name: Install dependencies
        working-directory: agentbot
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.lock
      - name: Compare the live descriptors with the frozen contract
        working-directory: agentbot
        env:
          AGENTBOT_TEST_GITHUB_MCP: "1"
          GITHUB_MCP_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_MCP_TOKEN:-}" ]; then
            echo "::warning title=Live descriptor gate skipped::MCP_GITHUB_TOKEN is not set, so the live MCP descriptors were not compared. Add it as a repository secret to turn this gate on."
            exit 0
          fi
          python -m unittest tests.integration.test_mcp_github_live -v
