# skills.sources.yaml — curated upstream skill sources for agentbot
# Install template (every entry):
#   npx --yes skills add <repo> --skill <name> ... \
#     -a cursor -a codex -a claude-code -g -y
# Use `skills: all` to install every skill supplied by a source; otherwise use
# a YAML list of explicit skill names.
#
# `repo` is `owner/name` on GitHub. Prefix a supported host to use another
# forge -- `gitlab.com/group/subgroup/name` -- which is also the only form
# that accepts the nested group paths GitLab allows and GitHub does not.
#
# Lockfile: global installs (-g) pin versions in ~/.agents/.skill-lock.json.
# This repo file stays a stub unless you switch to project-scoped installs.

version: 1
agents:
  - cursor
  - codex
  - claude-code
scope: global

sources:
  - id: superpowers
    repo: obra/superpowers
    skills:
      - brainstorming
      - writing-plans
      - executing-plans
      - subagent-driven-development
      - test-driven-development

  - id: devops-fullstack
    # NOTE: upstream org slug is literally "full-statck-skills" (misspelled on GitHub).
    # Verified: https://github.com/full-statck-skills/devops-skills — part of partme-ai/full-stack-skills ecosystem.
    repo: full-statck-skills/devops-skills
    skills:
      - kubernetes
      - terraform
      - gitlab-ci
    # Disabled: these three are template-generated stubs with identical filler
    # sections (partly untranslated) and no topic-specific depth. Real coverage
    # lives in claude-devops/devops-engineer references and devops-anmol/k8s.
    enabled: false

  - id: devops-anmol
    repo: anmolnagpal/devops-skills
    skills:
      - k8s
      - github-actions
      - owasp

  - id: claude-devops
    repo: jeffallan/claude-skills
    skills:
      - kubernetes-specialist
      - devops-engineer

  - id: research-papers
    repo: ShaishavMaisuria/research-paper-lifecycle-skills
    # literature-review references these three siblings ~25 times: find-papers
    # (key-free DBLP/Crossref/Semantic Scholar/arXiv search), fetch-paper
    # (legal open-access full text), and verify-citations (the bibliography
    # anti-hallucination gate). Installing literature-review alone left every
    # one of those code paths broken.
    skills:
      - literature-review
      - find-papers
      - fetch-paper
      - verify-citations

  - id: deslop
    repo: brycewang-stanford/Auto-Empirical-Research-Skills
    skills:
      - deslop

  - id: humanizer
    repo: blader/humanizer
    skills:
      - humanizer

  - id: simple-english
    repo: AminBlg/SimpleEnglish
    skills:
      - simple-english

  - id: writing-clearly-and-concisely
    repo: obra/the-elements-of-style
    skills:
      - writing-clearly-and-concisely

  - id: watermarks-remover
    repo: guillaumemeyer/watermarks-remover
    skills: all

  - id: akindu-agent-skills
    repo: Akindu23/my-agent-skills
    skills: all
    # This repository ships its own Skills-CLI test fixtures under
    # cli/test/fixtures/, and `skills: all` sweeps them in. They are not real
    # skills; excluding them keeps them out of every agent's context.
    # `tdd` duplicates superpowers/test-driven-development and, unlike most of
    # this source, is model-listed -- so it costs description budget twice over.
    # These four are model-listed (so they cost description budget) but are
    # niche or overlap skills that are kept: recursive-decomposition and
    # research overlap council/deep-research, svg-diagrams has a dangling
    # ../assets/ reference, and prototype is only ever offered optionally by
    # wayfinder. Their remaining 39 siblings are manual-only or path-scoped
    # and cost nothing, so they stay installed.
    exclude:
      - alpha
      - beta
      - tdd
      - recursive-decomposition
      - research
      - svg-diagrams
      - prototype

  - id: pamudu-agent-bootstrap-skills
    repo: PamuduW/agentbot_skills
    skills: all

  - id: gitlab-ci-official
    # GitLab's own CI/CD group ships this. Unlike the template stubs that used
    # to cover GitLab here, it carries eight references, worked broken ->
    # optimized examples, and `glci` integration that validates .gitlab-ci.yml
    # against a real runner locally before anything is pushed.
    repo: gitlab.com/gitlab-org/ci-cd/gitlab-ci-skill
    skills:
      - gitlab-ci-skill

  - id: obsidian
    # Obsidian's own creator. Six skills: obsidian-markdown is the one the
    # memory vault needs -- wikilinks, properties, callouts, embeds, tags --
    # and the rest are adopted with it by operator decision on 2026-09-19.
    # ADR-0003 records that decision, the research it overrides, and the
    # boundary it depends on: the Memory Core owns schema, path, provenance,
    # lifecycle and concurrency, and these skills own Obsidian syntax inside an
    # artifact the Memory Core has already approved. Where they disagree, the
    # Memory Core wins.
    #
    # obsidian-cli is the one to watch. It needs a running Obsidian instance
    # and can mutate notes directly, so it is a write path that does not pass
    # through `memory propose` and `memory approve`. Nothing may make it a
    # prerequisite: the vault stays fully operational with Obsidian closed.
    repo: kepano/obsidian-skills
    skills:
      - obsidian-markdown
      - obsidian-bases
      - json-canvas
      - obsidian-cli
      - defuddle
      - knap

  - id: obsidian-memory
    repo: AdamTylerLynch/obsidian-agent-memory-skills
    skills: []
    # Disabled, and the 2026-09-18 research says keep it that way: it is a
    # second canonical memory writer with its own schema, it updates shared
    # records (TODOs, overviews, both ends of a relationship) with no locking,
    # and it reads two unbounded files at every session start. The Memory Core
    # plus the Obsidian skills above cover what it was wanted for.
    enabled: false
